name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install local benchmark sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu restricts unprivileged user namespaces. Scope the exception
          # to this root-owned CI executable instead of disabling host policy.
          sudo install -d -m 0755 /usr/local/libexec/ml-analyser-ci
          sudo install -m 0755 /usr/bin/bwrap /usr/local/libexec/ml-analyser-ci/bwrap
          sudo apparmor_parser -r .github/ci/bwrap.apparmor
          echo /usr/local/libexec/ml-analyser-ci >> "$GITHUB_PATH"

      - name: Verify sandbox execution
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ml_analyser.execution.sandbox import ResourceLimits, run_sandbox

          with TemporaryDirectory() as directory:
              output = run_sandbox(
                  Path(directory), ["/usr/bin/printf", "sandbox-ready"],
                  ".", [], {}, ResourceLimits(),
              )
              assert output == "sandbox-ready", output
          PY

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check backend

      - name: Type check
        run: python -m mypy backend/ml_analyser

      - name: Test
        run: python -m pytest --cov=ml_analyser --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/analysis.js
          node --check frontend/metrics.js
          node --check frontend/analytics.js
          node --check frontend/workbench.js
          node --check frontend/plans.js
          node --check frontend/evaluate.js
          node --check frontend/onboarding.js
          node --check frontend/session.js
          node --check frontend/history.js
          node --check frontend/landing.mjs
          node --check frontend/engine-scene.mjs
          node --check frontend/engine-data.mjs
          node --check frontend/lab.js

      - name: Test score explanations
        run: node --test frontend/*.test.js

  judge-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build public demo image
        run: docker build -t ml-analyser-judge:ci .
      - name: Smoke test public demo with no secrets
        run: |
          docker run -d --name ml-analyser-judge -p 8000:8000 ml-analyser-judge:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 1
          done
          docker exec -i ml-analyser-judge python - <<'PY'
          import httpx
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ml_analyser.adapters.ml_training import MlTrainingAdapter
          from ml_analyser.core.auth import account_settings, seed_demos
          from ml_analyser.core.config import Settings
          from ml_analyser.lab.engine import replay

          with httpx.Client(base_url="http://127.0.0.1:8000") as client:
              assert client.get("/lab").status_code == 200
              assert client.get("/evaluate").status_code == 200
              prediction_csv = client.get(
                  "/static/examples/predictions-hidden-regression.csv"
              ).text
              prediction = client.post("/api/v1/evaluation/compare", json={
                  "task": "classification", "primary_metric": "f1_macro",
                  "csv_text": prediction_csv,
              })
              assert prediction.status_code == 200, prediction.text
              assert prediction.json()["decision"] == "rejected"
              assert prediction.json()["candidate"]["accuracy"] > prediction.json()["baseline"]["accuracy"]
              assert client.get("/api/v1/lab/status").json()["live_available"] is False
              assert client.post("/api/v1/runs/prepare", json={}).status_code == 403
              prepared = client.post("/api/v1/lab/prepare", json={}).json()
              result = client.post("/api/v1/lab/execute", json={
                  "plan": prepared["plan"], "approval_id": prepared["approval"]["id"],
                  "approved": True,
              })
              assert result.status_code == 200, result.text
              assert result.json()["winner_attempt"] == 3
              assert replay(result.json()) == []
              example = client.get("/static/examples/cache-capsule-live.json").json()
              assert replay(example) == []
          # Verify fixtures really shipped and run under the image's nonroot user.
          with TemporaryDirectory() as directory:
              settings = Settings(_env_file=None, auth_database=Path(directory) / "auth.db")
              account = account_settings(settings, "123")
              seed_demos(account)
              root = account.workspace_root / "ml-training-demo"
              assert (root / "train.csv").is_file()
              assert (account.workspace_root / "ml-regression-demo" / "train.py").is_file()
              adapter = MlTrainingAdapter()
              manifest = adapter.load_manifest(root)
              baseline = adapter.measure(root, manifest)
              adapter.apply_candidate(root, manifest)
              candidate = adapter.measure(root, manifest)
              assert candidate.metrics["f1"] > baseline.metrics["f1"]
          PY
      - name: Container logs
        if: always()
        run: docker logs ml-analyser-judge || true
