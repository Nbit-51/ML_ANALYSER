name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install local benchmark sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu restricts unprivileged user namespaces. Scope the exception
          # to this root-owned CI executable instead of disabling host policy.
          sudo install -d -m 0755 /usr/local/libexec/ml-analyser-ci
          sudo install -m 0755 /usr/bin/bwrap /usr/local/libexec/ml-analyser-ci/bwrap
          sudo apparmor_parser -r .github/ci/bwrap.apparmor
          echo /usr/local/libexec/ml-analyser-ci >> "$GITHUB_PATH"

      - name: Verify sandbox execution
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ml_analyser.execution.sandbox import ResourceLimits, run_sandbox

          with TemporaryDirectory() as directory:
              output = run_sandbox(
                  Path(directory), ["/usr/bin/printf", "sandbox-ready"],
                  ".", [], {}, ResourceLimits(),
              )
              assert output == "sandbox-ready", output
          PY

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check backend

      - name: Type check
        run: python -m mypy backend/ml_analyser

      - name: Test
        run: python -m pytest --cov=ml_analyser --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/analysis.js
          node --check frontend/metrics.js
          node --check frontend/analytics.js
          node --check frontend/workbench.js

      - name: Test score explanations
        run: node --test frontend/metrics.test.js frontend/analytics.test.js
